[package]
name = "srtla_send-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
srtla-core = { path = "../crates/srtla-core", features = ["test-internals"] }
srtla-protocol = { path = "../crates/srtla-protocol" }
tokio = { version = "1.49", default-features = false, features = ["rt"] }

# Keep the fuzz package out of the root workspace; it builds with its own lock.
[workspace]

[[bin]]
name = "protocol_parsers"
path = "fuzz_targets/protocol_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registration_rx"
path = "fuzz_targets/registration_rx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "connection_rx"
path = "fuzz_targets/connection_rx.rs"
test = false
doc = false
bench = false
